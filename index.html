<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PyNest 계정으로 들어가서 서로 공부 중인지 확인하는 스터디 공간. 접속 현황, 상태 설정, 화상 스터디룸.">
<link rel="canonical" href="https://whale7777.github.io/nestmate/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nestmate">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="Nestmate · 같이 공부하는 사람들">
<meta property="og:description" content="PyNest 계정으로 입장해 서로 공부 중인지 확인하는 스터디 공간.">
<meta property="og:url" content="https://whale7777.github.io/nestmate/">
<meta property="og:image" content="https://whale7777.github.io/nestmate/assets/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#3B6CF6">
<link rel="icon" href="assets/icon-192.png">
<title>Nestmate · 같이 공부하는 사람들</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 둥지 같은 따뜻한 틀 안에 접속자가 둥지새 캐릭터로 떠 있는 스터디 라운지. 랜딩은 가운데 정렬 히어로, 앱은 좌측 접속자 + 우측 스터디룸 2단 */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface2:#E8ECF6; --fg:#141B34; --muted:#5A6485; --line:#D9DFEE;
  --accent:#3B6CF6; --accent-fg:#FFFFFF; --accent-soft:#DDE6FF;
  --warm:#A85F0C; --warm-soft:#F5DFBE;
  --st-study:#1D9A58; --st-rest:#C99510; --st-away:#8591B5; --st-dnd:#C94545; --bad:#B93636;
  --shadow:0 1px 2px rgba(20,27,52,.06); --shadow-lg:0 12px 36px rgba(20,27,52,.18); --scrim:rgba(10,20,18,.5);
  --f-display:'Black Han Sans','Noto Sans KR',sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1226; --surface:#141B34; --surface2:#1D2748; --fg:#E8EDFB; --muted:#9AA6CC; --line:#2A3560;
    --accent:#6C8CFF; --accent-fg:#0B1230; --accent-soft:#1B2B66;
    --warm:#F0B15A; --warm-soft:#3A2A12;
    --st-study:#3CCB84; --st-rest:#E2B43A; --st-away:#8591B5; --st-dnd:#F07575; --bad:#F28585;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1226; --surface:#141B34; --surface2:#1D2748; --fg:#E8EDFB; --muted:#9AA6CC; --line:#2A3560;
  --accent:#6C8CFF; --accent-fg:#0B1230; --accent-soft:#1B2B66;
  --warm:#F0B15A; --warm-soft:#3A2A12;
  --st-study:#3CCB84; --st-rest:#E2B43A; --st-away:#8591B5; --st-dnd:#F07575; --bad:#F28585;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 36px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
.shell{max-width:1180px;margin:0 auto;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px}
.sp{flex:1}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:21px;letter-spacing:.01em}
.logo{border:0;background:none;padding:0}
.toplinks{display:flex;gap:4px;margin-left:auto}
.link{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.link:hover{background:var(--surface2);color:var(--fg)}
.navp{display:flex;gap:4px;margin-left:12px}
.pill{border:0;background:none;padding:8px 14px;border-radius:99px;color:var(--muted);font-weight:500}
.pill:hover{background:var(--surface2)}
.pill[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.popwrap{position:relative}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:none;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--surface2);color:var(--fg)}
.ib.sq{border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px;z-index:30}
.launch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ltile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;border-radius:12px;background:none;font-size:13px;font-weight:500}
.ltile:hover{background:var(--surface2)}
.menu{display:flex;flex-direction:column;margin-top:8px}
.mi{display:flex;align-items:center;gap:10px;padding:10px;border:0;background:none;border-radius:10px;text-align:left}
.mi:hover{background:var(--surface2)}
.who-pop{display:flex;align-items:center;gap:10px;padding:4px 4px 10px;border-bottom:1px solid var(--line)}
.glyph{display:inline-grid;place-items:center;border-radius:12px;font-family:var(--f-display);flex:none;overflow:hidden}
.glyph.py{background:var(--accent-soft);color:var(--accent)}
.glyph.mcom{background:var(--warm-soft);color:var(--warm)}
.glyph svg{width:100%;height:100%;display:block}

/* buttons, chips, form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.lg{min-height:48px;padding:0 24px;font-size:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dng{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:500;color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.adm{background:var(--warm-soft);color:var(--warm)}
.rb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;vertical-align:1px}
.rb.adm{background:var(--warm-soft);color:var(--warm)}
input[type="text"],input[type="password"],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px;width:100%;min-width:0}
select{padding-right:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.inl{display:flex;gap:8px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-bottom:8px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.6vw,28px);line-height:1.25;text-wrap:balance}
.h3{font-size:16px;font-weight:700}
.mt{margin-top:20px}
.cnt{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;margin-left:6px;font-family:var(--f-mono)}

/* avatar and presence */
.av{position:relative;display:inline-block;flex:none}
.av svg{width:100%;height:100%;border-radius:50%;display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--st-away));flex:none}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border:2px solid var(--ring,var(--surface))}
.st-study{--c:var(--st-study)} .st-rest{--c:var(--st-rest)} .st-dnd{--c:var(--st-dnd)}
.st-away{background:transparent;border:2px solid var(--st-away)}
.av .dot.st-away{background:var(--surface)}

/* landing */
.hero{max-width:780px;margin:0 auto;padding-block:56px 32px;text-align:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,62px);line-height:1.2;margin:12px 0 16px;text-wrap:balance}
.lead{color:var(--muted);font-size:17px;max-width:54ch;margin:0 auto 26px;text-wrap:pretty}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.live{--ring:var(--bg);display:flex;align-items:center;justify-content:center;gap:14px;margin-top:34px;flex-wrap:wrap}
.stack{display:flex;padding-left:8px}
.stack .av{margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}
.sec{padding-block:40px}
.sec>h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);margin-bottom:18px;text-wrap:balance}
.svcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.svc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.svc p{color:var(--muted);flex:1}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:20px;counter-reset:s}
.steps li{border-top:2px solid var(--accent);padding-top:12px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);color:var(--accent);font-size:13px}
.steps b{display:block;margin:2px 0 4px;font-size:16px}
.steps p{color:var(--muted)}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px}
.feat p.lead{margin:0;text-align:left}
.frows>div{padding-block:14px;border-top:1px solid var(--line)}
.frows dt{font-weight:700}
.frows dd{color:var(--muted)}
.foot{padding-block:24px 36px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:24px}

/* modal */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px}
.dlg h2{margin-bottom:4px}
.acct{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:none;margin-top:8px}
.acct:hover{background:var(--surface2)}
.demo-accts{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

/* app */
.banner{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--warm-soft);color:var(--warm)}
.banner b{flex:none}
.study{display:grid;gap:16px;grid-template-columns:minmax(0,330px) minmax(0,1fr);grid-template-areas:"me room" "roster room";align-items:start;padding-block:20px 110px}
#mycard{grid-area:me} #roster{grid-area:roster} #room{grid-area:room}
.mc-top{display:flex;align-items:center;gap:12px}
.nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.big{font-size:17px}
.clockbox{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 12px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.clockbox .big{font-size:26px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.segb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.segb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg.sm{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg.sm .segb{border:0;border-radius:0;min-height:32px;font-size:13px;background:var(--surface)}
.seg.sm .segb+.segb{border-left:1px solid var(--line)}
.actform{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.rs-head{display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;margin:10px 0}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.chipb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rows{max-height:480px;overflow:auto}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-radius:10px}
.row+.row{border-top:1px solid var(--line)}
.row .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stl{color:var(--fg);font-weight:500}
.row .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .meta svg{color:var(--accent)}
.you{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700}
.pad{padding:12px 4px}
.room-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.prejoin{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.prejoin-side{display:flex;flex-direction:column;gap:12px}
.sub-h{font-size:14px;margin:20px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills li{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;font-size:13px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.tile{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--surface2);max-width:100%}
.tile::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 0 var(--accent);transition:box-shadow .15s}
.tile.speaking::after{box-shadow:inset 0 0 0 3px var(--accent)}
.scene,.noncam{position:absolute;inset:0}
.noncam{display:grid;place-items:center}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bgsvg{transform:scale(1.08)}
.b1 .bgsvg{filter:blur(4px)} .b2 .bgsvg{filter:blur(9px)}
.person{animation:breathe 4s ease-in-out infinite;transform-origin:80px 100px}
.speaking .mouth{animation:talk .3s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:translateY(1.6px)}}
@keyframes talk{to{transform:scaleY(3)}}
.tlabel{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;background:rgba(10,20,18,.62);color:#fff;font-size:12px;max-width:calc(100% - 16px)}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo{position:absolute;right:8px;top:8px;font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(10,20,18,.55);color:#fff}
.tile.mini .tlabel{font-size:10px;left:4px;bottom:4px;padding:2px 6px}
.tile.mini .demo{display:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.cbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.cbtn:hover{background:var(--surface2)}
.cbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cbtn.leave{background:var(--bad);border-color:var(--bad);color:var(--accent-fg)}
.cbtn:disabled{opacity:.5;cursor:not-allowed}
.blurbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blurbox.dis{opacity:.5;pointer-events:none}

/* PIP and bubble */
.pip{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:248px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.pip-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;font-size:12px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--line)}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.pip-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}
.pip-ctl{display:flex;gap:4px;justify-content:center;padding:4px 4px 8px}
.pip-ctl .ib{border:1px solid var(--line)}
.pip-ctl .ib.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pip-ctl .ib.leave{background:var(--bad);color:var(--accent-fg);border-color:var(--bad)}
.bubble{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.bubble .bt{font-weight:700;font-size:14px;white-space:nowrap}
.bubble .mono{font-size:13px;color:var(--muted)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);animation:rise .2s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* services, prefs */
.svc-head{padding-block:24px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.list{margin-top:12px}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item>div{flex:1;min-width:160px}
.prefs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;padding-block:24px 110px;align-items:start}
.idrow{display:flex;align-items:center;gap:14px}
.linked li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.linked li>div{flex:1;min-width:0}
.prefrows li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.prefrows li:first-child{border-top:0}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.track{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--line);transition:background .15s;pointer-events:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked+.track{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.track::after{transform:translateX(18px);background:var(--accent-fg)}
.sw input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}

/* admin */
.admin{padding-block:24px 110px;display:flex;flex-direction:column;gap:16px}
.adm-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-family:var(--f-mono);font-weight:500}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
td .sel{width:auto;min-height:34px}
.cellwho{display:flex;align-items:center;gap:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.logrow{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.logrow:first-child{border-top:0}
.logrow .mono{color:var(--muted);font-size:12px;padding-top:2px;flex:none}
.empty{text-align:center;padding:40px 16px}
.empty h2{margin-bottom:8px}
.formgrid{display:grid;gap:14px;max-width:520px}

@media (max-width:860px){
  .study{grid-template-columns:minmax(0,1fr);grid-template-areas:"me" "room" "roster"}
  .prefs{grid-template-columns:minmax(0,1fr)}
  .feat{grid-template-columns:minmax(0,1fr);gap:16px}
}
@media (max-width:720px){ .navp{display:none} }
@media (max-width:640px){ .toplinks{display:none} .prejoin{grid-template-columns:minmax(0,1fr)} .hero{padding-block:36px 24px} .sec{padding-block:28px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

function setRoute(name){

  if(S.me&&S.route==='study'&&name!=='study'&&S.call.joined&&S.prefs.autoPip&&S.prefs.nestmate)S.call.pip=true;
  if(name==='study')S.call.pip=false;

}

  var el=$('#admstats');if(!el)return;
  var inRoom=roomCount(),cams=S.peers.filter(function(p){return p.room&&p.cam}).length+(S.call.joined&&S.call.cam?1:0);
  var staff=S.peers.filter(function(p){return p.role!=='member'}).length+1;
  el.innerHTML='<div class="stats"><div class="stat"><span class="lbl">온라인</span><b>'+(S.peers.length+1)+'</b></div><div class="stat"><span class="lbl">스터디룸 참여</span><b>'+inRoom+'</b></div><div class="stat"><span class="lbl">카메라 켠 사람</span><b>'+cams+'</b></div><div class="stat"><span class="lbl">관리자·모더레이터</span><b>'+staff+'</b></div></div>';
}
function adminBodyHTML(){
  var t=S.adminTab;
  if(t==='members'){
    var rows='<tr><td><div class="cellwho">'+avatar(meUser(),32,'')+'<div><b>'+esc(S.me.name)+'</b> <span class="you">나</span><div class="muted small mono">'+esc(S.me.id)+'</div></div></div></td><td>'+ROLE[S.me.role]+'</td><td><span class="dot '+ST[S.myStatus.status].cls+'"></span> '+ST[S.myStatus.status].label+'</td><td>'+tspan(S.me.joinedAt,'short')+'</td><td>'+(S.call.joined?'참여':'-')+'</td><td class="muted small">본인 계정</td></tr>';
    rows+=S.peers.slice().sort(function(a,b){return a.since-b.since}).map(function(p){
      return '<tr><td><div class="cellwho">'+avatar(p,32,'')+'<div><b>'+esc(p.name)+'</b><div class="muted small mono">'+p.id+'</div></div></div></td>'+
      '<td><select class="sel" data-role="'+p.id+'" aria-label="'+esc(p.name)+' 역할">'+['member','mod','admin'].map(function(r){return '<option value="'+r+'"'+(p.role===r?' selected':'')+'>'+ROLE[r]+'</option>'}).join('')+'</select></td>'+
      '<td><span class="dot '+ST[p.status].cls+'"></span> '+ST[p.status].label+'</td><td>'+tspan(p.since,'short')+'</td><td>'+(p.room?'참여'+(p.cam?' · 카메라':''):'-')+'</td>'+
      '<td><div class="acts"><button class="btn sm" data-act="kick" data-id="'+p.id+'"'+(p.room?'':' disabled')+'>방에서 내보내기</button><button class="btn sm dng" data-act="force-out" data-id="'+p.id+'">로그아웃 시키기</button></div></td></tr>';
    }).join('');
    return '<div class="tablewrap"><table><thead><tr><th>멤버</th><th>역할</th><th>상태</th><th>접속</th><th>스터디룸</th><th>작업</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  if(t==='room'){
    return '<div class="formgrid"><div class="prefrows"><li style="border:0;padding:0"><div><label for="rm-lock"><b>스터디룸 잠금</b></label><div class="muted small">잠그면 관리자 외에는 새로 입장할 수 없습니다.</div></div>'+swHTML('rm-lock','data-lock="1"',S.room.locked)+'</li></div>'+
    '<div class="field"><label class="lbl" for="rm-max">최대 인원</label><select id="rm-max" data-maxsel="1">'+[4,6,10].map(function(n){return '<option value="'+n+'"'+(S.room.max===n?' selected':'')+'>'+n+'명</option>'}).join('')+'</select></div>'+
    '<div class="acts"><button class="btn" data-act="mute-all">모두 음소거</button><button class="btn dng" data-act="clear-room">방 비우기</button></div><p class="note" style="margin:0">지금 방에 '+roomCount()+'명이 있습니다.</p></div>';
  }
  if(t==='notice'){
    return '<form class="formgrid" data-form="announce"><div class="field"><label class="lbl" for="ann">모든 접속자에게 보여 줄 공지</label><input type="text" id="ann" maxlength="80" placeholder="예: 10시에 스터디룸을 정리해요" value="'+esc(S.room.announce)+'"></div><div class="acts"><button class="btn pri" type="submit">공지 보내기</button><button class="btn" type="button" data-act="clear-notice">공지 내리기</button></div></form>';
  }
  if(t==='flags'){
    var F=[['nestmate','Nestmate 전체','끄면 일반 멤버 화면에서 스터디룸이 막혀요.'],['camera','카메라 허용','끄면 모두의 카메라가 꺼져요.'],['blur','배경 블러 허용','끄면 블러 설정이 비활성화됩니다.']];
    return '<ul class="prefrows">'+F.map(function(f){return '<li><div><label for="fl-'+f[0]+'"><b>'+f[1]+'</b></label><div class="muted small">'+f[2]+'</div></div>'+swHTML('fl-'+f[0],'data-flag="'+f[0]+'"',S.flags[f[0]])+'</li>'}).join('')+'</ul>';
  }
  return '<div>'+S.log.map(function(l){return '<div class="logrow"><span class="mono">'+hhmm(l.t)+'</span><span>'+esc(l.text)+'</span></div>'}).join('')+'</div>';
}
function renderAdmin(){var b=$('#admin-body');if(!b)return;renderAdminStats();b.innerHTML=adminBodyHTML()}
function afterAdmin(){renderAdmin();renderRoster();renderRoom();renderOverlay()}

/* ---------- toast ---------- */
function toast(msg){
  var box=$('#toasts');if(!box)return;
  var t=document.createElement('div');t.className='toast';t.textContent=msg;box.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},3200);
}

/* ---------- events ---------- */
function touchMe(){renderMy();renderRoster();renderRoom();renderOverlay()}
document.addEventListener('click',function(e){
  if(S.pop&&!e.target.closest('.popwrap')){S.pop=null;renderTop()}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  switch(a){
    case 'open-login':openLogin();break;
    case 'close-modal':if(e.target===el||el.tagName==='BUTTON')closeModal();break;
    case 'demo-login':login(el.dataset.id,ACCOUNTS[el.dataset.id].pw);break;
    case 'logout':logout();break;
    case 'scroll':{var t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'nav':setRoute(el.dataset.to);break;
    case 'pop':S.pop=(S.pop===el.dataset.k)?null:el.dataset.k;renderTop();break;
    case 'set-status':S.myStatus.status=el.dataset.st;S.myStatus.since=Date.now();S.myStatus.auto=false;touchMe();break;
    case 'filter':S.filter=el.dataset.f;renderRoster();break;
    case 'join':{
      var staff=S.me.role==='admin';
      if(!staff&&(S.room.locked||roomCount()>=S.room.max)){toast('지금은 들어갈 수 없습니다');break}
      S.call.joined=true;S.call.startedAt=Date.now();addLog(S.me.name+' 스터디룸 입장');touchMe();toast('스터디룸에 입장했어요. 카메라는 꺼져 있습니다');break}
    case 'leave':S.call.joined=false;S.call.pip=false;addLog(S.me.name+' 스터디룸 퇴장');touchMe();break;
    case 'tog-cam':if(S.flags.camera){S.call.cam=!S.call.cam;renderRoom();renderOverlay()}break;
    case 'tog-mic':S.call.mic=!S.call.mic;renderRoom();renderOverlay();break;
    case 'set-blur':S.call.blur=Number(el.dataset.v);renderRoom();renderOverlay();break;
    case 'pip':S.call.pip=true;setRoute(S.lastRoute||'pynest');toast('PIP로 띄웠어요. 다른 화면에서도 따라와요');break;
    case 'pip-expand':setRoute('study');break;
    case 'pip-close':S.call.pip=false;renderOverlay();break;
    case 'start-session':
      S.session={app:el.dataset.app,title:el.dataset.title,since:Date.now()};
      if(S.prefs.autoStatus&&S.prefs.nestmate){S.myStatus={status:'study',activity:S.session.title+' '+el.dataset.verb,app:S.session.app,since:Date.now(),auto:true};toast('Nestmate 상태를 자동으로 바꿨어요')}
      renderView();renderOverlay();break;
    case 'stop-session':
      S.session=null;
      if(S.myStatus.auto)S.myStatus={status:'study',activity:'',app:'nestmate',since:Date.now(),auto:false};
      renderView();renderOverlay();break;
    case 'admtab':S.adminTab=el.dataset.k;renderView();break;
    case 'kick':{var p=S.peers.find(function(x){return x.id===el.dataset.id});if(p){p.room=false;addLog(S.me.name+'이(가) '+p.name+'을(를) 스터디룸에서 내보냈어요');toast(p.name+' 님을 방에서 내보냈어요');afterAdmin()}break}
    case 'force-out':{var i=S.peers.findIndex(function(x){return x.id===el.dataset.id});if(i>=0){var q=S.peers.splice(i,1)[0];addLog(S.me.name+'이(가) '+q.name+'을(를) 로그아웃시켰어요');toast(q.name+' 님을 로그아웃시켰어요');afterAdmin()}break}
    case 'mute-all':S.peers.forEach(function(p){p.mic=false});S.call.mic=false;addLog('모든 참여자 음소거');toast('모두 음소거했어요');afterAdmin();break;
    case 'clear-room':S.peers.forEach(function(p){p.room=false});addLog('스터디룸을 비웠어요');toast('방을 비웠어요');afterAdmin();break;
    case 'clear-notice':S.room.announce='';addLog('공지를 내렸어요');renderBanner();renderAdmin();break;
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  if(k==='login'){
    var ok=login($('#lg-id').value,$('#lg-pw').value);
    if(!ok){var er=$('#lg-err');if(er)er.textContent='ID나 비밀번호가 맞지 않아요. 아래 데모 계정을 눌러 보세요.'}
  }else if(k==='activity'){
    S.myStatus.activity=$('#act').value.trim();S.myStatus.auto=false;touchMe();toast('상태를 저장했어요');
  }else if(k==='announce'){
    S.room.announce=$('#ann').value.trim();addLog(S.room.announce?'공지: '+S.room.announce:'공지를 내렸어요');renderBanner();toast(S.room.announce?'공지를 보냈어요':'공지를 내렸어요');
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('[data-pref]')){
    var k=t.dataset.pref;S.prefs[k]=t.checked;savePrefs();
    if(k==='nestmate'&&!t.checked&&S.call.joined){S.call.joined=false;S.call.pip=false}
    renderOverlay();
  }else if(t.matches('[data-role]')){
    var p=S.peers.find(function(x){return x.id===t.dataset.role});
    if(p){p.role=t.value;addLog(S.me.name+'이(가) '+p.name+'의 역할을 '+ROLE[p.role]+'(으)로 바꿨어요');toast(p.name+' 님의 역할을 바꿨어요');afterAdmin()}
  }else if(t.matches('[data-lock]')){
    S.room.locked=t.checked;addLog('스터디룸 '+(t.checked?'잠금':'잠금 해제'));afterAdmin();
  }else if(t.matches('[data-maxsel]')){
    S.room.max=Number(t.value);addLog('최대 인원 '+S.room.max+'명');afterAdmin();
  }else if(t.matches('[data-flag]')){
    var fk=t.dataset.flag;S.flags[fk]=t.checked;if(fk==='camera'&&!t.checked)S.call.cam=false;
    addLog('기능 스위치 '+fk+' '+(t.checked?'켜짐':'꺼짐'));afterAdmin();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#modal').innerHTML)closeModal();else if(S.pop){S.pop=null;renderTop()}}
});
window.addEventListener('hashchange',function(){var n=location.hash.slice(1);if(S.me&&ROUTES.indexOf(n)>=0&&n!==S.route)setRoute(n)});

/* PIP drag */
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest('[data-drag]');if(!h||e.target.closest('button'))return;
  var p=$('#pip');if(!p)return;var r=p.getBoundingClientRect();
  dragging={dx:e.clientX-r.left,dy:e.clientY-r.top};
  try{h.setPointerCapture(e.pointerId)}catch(err){}
  p.style.right='auto';p.style.bottom='auto';p.style.left=r.left+'px';p.style.top=r.top+'px';
});
document.addEventListener('pointermove',function(e){
  if(!dragging)return;var p=$('#pip');if(!p)return;
  var x=Math.min(Math.max(0,e.clientX-dragging.dx),innerWidth-p.offsetWidth);
  var y=Math.min(Math.max(0,e.clientY-dragging.dy),innerHeight-p.offsetHeight);
  p.style.left=x+'px';p.style.top=y+'px';S.call.pipPos={x:x,y:y};
});
document.addEventListener('pointerup',function(){dragging=null});

/* ---------- simulation ---------- */
function refreshLive(){
  if(!S.me){renderLive();return}
  renderRoster();
  if(S.route==='study')renderRoom();
  if(S.route==='admin'){var a=document.activeElement;if(a&&a.closest&&a.closest('#admin-body'))renderAdminStats();else renderAdmin()}
  renderOverlay();
}
function simStep(){
  var r=Math.random(),p;
  if(S.peers.length<5||(r<.18&&S.offline.length)){
    p=S.offline.shift();
    if(p){p.since=Date.now();p.status='study';p.activity=pick(ACTS);p.room=false;p.cam=false;S.peers.push(p);addLog(p.name+' 접속');if(S.me)toast(p.name+' 님이 들어왔어요')}
  }else if(r<.3&&S.peers.length>5){
    p=S.peers.splice(Math.floor(Math.random()*S.peers.length),1)[0];p.room=false;S.offline.push(p);addLog(p.name+' 접속 종료');
  }else if(r<.6){
    p=pick(S.peers);var k=pick(['study','study','study','rest','away']);
    p.status=k;p.activity=k==='study'?pick(ACTS):(k==='rest'?'잠깐 쉬는 중':'');p.app=pick(['nestmate','pynest','mcom']);if(k!=='study')p.room=false;
  }else if(r<.8){
    p=pick(S.peers.filter(function(x){return x.status==='study'}));
    if(p){if(p.room)p.room=false;else if(!S.room.locked&&roomCount()<S.room.max){p.room=true;p.cam=Math.random()<.5;p.mic=Math.random()<.3;p.blur=pick([0,1,2]);addLog(p.name+' 스터디룸 입장')}}
  }else{
    p=pick(S.peers.filter(function(x){return x.room}));
    if(p){if(Math.random()<.5)p.cam=!p.cam;else p.mic=!p.mic}
  }
  refreshLive();
}
setInterval(simStep,6500);
setInterval(function(){
  var now=Date.now();
  $$('[data-since]').forEach(function(el){var ms=now-Number(el.dataset.since);el.textContent=el.dataset.fmt==='clock'?clock(ms):short(ms)});
},1000);
setInterval(function(){
  if(!S.me)return;
  $$('[data-tile]').forEach(function(t){
    var id=t.dataset.tile,on=false;
    if(id===S.me.id)on=S.call.joined&&S.call.mic&&Math.random()<.3;
    else{var p=S.peers.find(function(x){return x.id===id});on=!!(p&&p.room&&p.mic&&Math.random()<.5)}
    t.classList.toggle('speaking',on);
  });
},1400);

loadPrefs();render();
})();
</script>

</body>
</html>
